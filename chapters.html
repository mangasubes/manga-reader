<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Capítulos</title>

<style>

body{
margin:0;
font-family:Arial;
background:#111;
color:white;
}

.chapter{
padding:12px;
border-bottom:1px solid #333;
cursor:pointer;
}

.chapter:hover{
background:#222;
}

</style>

</head>

<body>

<div id="chapterList"></div>

<script>

const params=
new URLSearchParams(location.search)

const folder=
params.get("manga")

fetch(folder+"info.json")
.then(r=>r.json())
.then(data=>{

const list=
document.getElementById("chapterList")

data.chapters.forEach(ch=>{

const div=
document.createElement("div")

div.className="chapter"

div.innerText=ch.title

div.onclick=()=>{

location=
`reader.html?manga=${folder}&chapter=${ch.file}`

}

list.appendChild(div)

})

})

</script>

</body>
</html>
